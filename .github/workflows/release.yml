name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - id: identity
        name: Validate immutable original-core tag
        run: |
          set -euo pipefail
          node scripts/prepare-core-release.mjs --check-tag "$GITHUB_REF_NAME"
          node --input-type=module -e 'import {readFile} from "node:fs/promises"; const f=JSON.parse(await readFile("retrom-fork.json")); if(f.forkRepository!==`https://github.com/${process.env.GITHUB_REPOSITORY}`) throw Error("Release repository mismatch");'
          tag_ref="refs/retrom-release/$GITHUB_REF_NAME"
          git fetch --no-tags origin "refs/tags/$GITHUB_REF_NAME:$tag_ref"
          test "$(git cat-file -t "$tag_ref")" = tag
          test "$(git rev-list -n 1 "$tag_ref")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
  quality:
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [validate, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: catsystem2-native-vendor
          path: .local/vendor
      - name: Build and compare both complete official archives
        run: |
          set -euo pipefail
          # Candidate provenance records an actual attached local build branch.
          # The commit is still the already validated immutable tag commit.
          git switch -c "build/release-$GITHUB_REF_NAME"
          mkdir "$RUNNER_TEMP/core-first" "$RUNNER_TEMP/core-second" "$RUNNER_TEMP/core-release"
          .github/rpg-runtime/build-candidate.sh "$RUNNER_TEMP/core-first"
          .github/rpg-runtime/build-candidate.sh "$RUNNER_TEMP/core-second"
          node scripts/prepare-core-release.mjs --first "$RUNNER_TEMP/core-first" --second "$RUNNER_TEMP/core-second" --tag "$GITHUB_REF_NAME" --output "$RUNNER_TEMP/core-release"
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/core-release/catsystem2-web.tar.gz" \
            "$RUNNER_TEMP/core-release/catsystem2-web-LICENSE.txt" \
            "$RUNNER_TEMP/core-release/catsystem2-web-release.json" \
            --verify-tag --generate-notes "${flags[@]}"
